<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Internet Relay - Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
    h1 { margin-bottom: 8px; }
    .sub { color: #94a3b8; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
    .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: #38bdf8; }
    pre { background: #020617; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; max-height: 400px; }
    button { background: #0ea5e9; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; margin-right: 8px; margin-top: 12px; }
    button:hover { background: #0284c7; }
    input, textarea { width: 100%; background: #020617; border: 1px solid #334155; color: #e2e8f0; padding: 10px; border-radius: 8px; margin-top: 8px; }
    textarea { min-height: 80px; font-family: monospace; }
    .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; }
    .pending { background: #854d0e; color: #fef08a; }
    .done { background: #166534; color: #bbf7d0; }
    .error { background: #7f1d1d; color: #fecaca; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <h1>AI Internet Relay</h1>
  <p class="sub">Disposable repo · URL-based communication · <a href="https://github.com/yooohubyooodev-serverscript/ai-internet-relay-temp" target="_blank">GitHub Repo</a></p>

  <div class="grid">
    <div class="card">
      <h2>📥 Inbox (AI → Terminal)</h2>
      <pre id="inbox">Loading...</pre>
      <button onclick="loadInbox()">Refresh Inbox</button>
    </div>
    <div class="card">
      <h2>📤 Outbox (Terminal → AI)</h2>
      <pre id="outbox">Loading...</pre>
      <button onclick="loadOutbox()">Refresh Outbox</button>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <h2>ส่งคำสั่งใหม่ (จำลองฝั่ง AI)</h2>
    <p style="color:#94a3b8;font-size:0.9rem;margin-bottom:8px">พิมพ์คำสั่งแบบ <code>CMD:ls -la && echo hello</code> หรือใส่ JSON</p>
    <textarea id="cmdInput" placeholder='CMD:echo "Hello from browser" && date'></textarea>
    <br>
    <button onclick="sendCommand()">Send to Inbox</button>
    <p id="sendStatus" style="margin-top:10px;color:#94a3b8"></p>
  </div>

  <script>
    const REPO = "yooohubyooodev-serverscript/ai-internet-relay-temp";
    // หมายเหตุ: สำหรับ production ควรใช้ token ผ่าน backend ไม่ควรใส่ใน frontend
    // หน้านี้เป็น demo เท่านั้น และจะอ่าน raw ได้โดยไม่ต้อง token เพราะ repo เป็น public

    async function loadInbox() {
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/mailbox/inbox.json?t=${Date.now()}`);
        const data = await res.json();
        document.getElementById("inbox").textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById("inbox").textContent = "Error: " + e.message;
      }
    }

    async function loadOutbox() {
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/mailbox/outbox.json?t=${Date.now()}`);
        const data = await res.json();
        document.getElementById("outbox").textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById("outbox").textContent = "Error: " + e.message;
      }
    }

    async function sendCommand() {
      const input = document.getElementById("cmdInput").value.trim();
      if (!input) return alert("ใส่คำสั่งก่อน");

      document.getElementById("sendStatus").textContent = "หมายเหตุ: การเขียนต้องใช้ token ดังนั้นปุ่มนี้เป็น demo เท่านั้น — ใช้ curl หรือสคริปต์ฝั่ง AI ในการเขียนจริง";
      // ในระบบจริง AI จะใช้ token เขียนผ่าน API
    }

    loadInbox();
    loadOutbox();
    setInterval(() => { loadInbox(); loadOutbox(); }, 15000);
  </script>
</body>
</html>
